<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Bank | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/variables.css">
  <link rel="stylesheet" href="Styles/base.css">
  <link rel="stylesheet" href="Styles/auth.css">
  <link rel="stylesheet" href="Styles/dashboard.css">
  <link rel="stylesheet" href="Styles/components.css">
  <link rel="stylesheet" href="Styles/responsive.css">
</head>
<body class="auth-page"> 
  <main class="auth-shell">
    <div>
      <div class="auth-brand">
        <img src="media/AB_sin_fondo.jpg" alt="Logo Acme Bank" style="height:44px;width:auto;object-fit:contain">
        <span class="auth-brand-name">Acme Bank</span>
      </div>

      <section class="auth-card">
        <h1>Bienvenido</h1>
        <p class="subtitle">Portal transaccional seguro — inicia sesión para continuar</p>

        <form id="loginForm" novalidate>
          <label for="docType">Tipo de identificación</label>
          <select id="docType" required>
            <option value="">Selecciona una opción</option>
            <option value="Cedula de ciudadania">Cédula de ciudadanía</option>
            <option value="Cedula de extranjeria">Cédula de extranjería</option>
            <option value="Pasaporte">Pasaporte</option>
          </select>
          <small class="error" data-for="docType"></small>

          <label for="docNumber">Número de identificación</label>
          <input id="docNumber" type="text" inputmode="numeric" placeholder="Ej: 1234567890" required>
          <small class="error" data-for="docNumber"></small>

          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required minlength="8">
          <small class="error" data-for="password"></small>

          <p id="loginFeedback" class="feedback"></p>
          <button type="submit">
            <span class="material-symbols-outlined" style="font-size:18px;margin-right:6px;vertical-align:middle">lock</span>
            Iniciar sesión
          </button>
        </form>

        <nav class="auth-links">
          <a href="registro.html">
            <span class="material-symbols-outlined" style="font-size:15px;margin-right:4px;vertical-align:middle">person_add</span>
            Crear cuenta
          </a>
          <a href="recuperar.html">
            <span class="material-symbols-outlined" style="font-size:15px;margin-right:4px;vertical-align:middle">key</span>
            Recordar contraseña
          </a>
        </nav>
      </section>
    </div>
  </main>
  <script type="module" src="JS/main.js"></script>
</body>
</html>
