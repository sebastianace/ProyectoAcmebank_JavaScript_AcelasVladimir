<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Bank | Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/variables.css">
  <link rel="stylesheet" href="Styles/base.css">
  <link rel="stylesheet" href="Styles/auth.css">
  <link rel="stylesheet" href="Styles/dashboard.css">
  <link rel="stylesheet" href="Styles/components.css">
  <link rel="stylesheet" href="Styles/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div>
      <div class="auth-brand">
        <img src="media/AB_sin_fondo.jpg" alt="Logo Acme Bank" style="height:44px;width:auto;object-fit:contain">
        <span class="auth-brand-name">Acme Bank</span>
      </div>

      <section class="auth-card">
        <h1>Recuperar contraseña</h1>
        <p class="subtitle">Valida tus datos y asigna una nueva clave de acceso</p>

        <form id="verifyForm" novalidate>
          <label for="idType">Tipo de identificación</label>
          <select id="idType" required>
            <option value="">Selecciona una opción</option>
            <option value="Cedula de ciudadania">Cédula de ciudadanía</option>
            <option value="Cedula de extranjeria">Cédula de extranjería</option>
            <option value="Pasaporte">Pasaporte</option>
          </select>
          <small class="error" data-for="idType"></small>

          <label for="idNumber">Número de identificación</label>
          <input id="idNumber" type="text" inputmode="numeric" placeholder="Ej: 1234567890" required>
          <small class="error" data-for="idNumber"></small>

          <label for="email">Correo electrónico registrado</label>
          <input id="email" type="email" placeholder="correo@ejemplo.com" required>
          <small class="error" data-for="email"></small>

          <p id="verifyFeedback" class="feedback"></p>
          <button type="submit">
            <span class="material-symbols-outlined" style="font-size:18px;margin-right:6px;vertical-align:middle">verified_user</span>
            Validar identidad
          </button>
        </form>

        <form id="resetForm" class="hidden" novalidate>
          <label for="newPassword">Nueva contraseña <span style="font-weight:400;opacity:.7">(mín. 8 caracteres, 1 mayúscula y 1 número)</span></label>
          <input id="newPassword" type="password" placeholder="••••••••" required>
          <small class="error" data-for="newPassword"></small>
          <p id="resetFeedback" class="feedback"></p>
          <button type="submit">
            <span class="material-symbols-outlined" style="font-size:18px;margin-right:6px;vertical-align:middle">lock_reset</span>
            Actualizar contraseña
          </button>
        </form>

        <nav class="auth-links">
          <a href="index.html">
            <span class="material-symbols-outlined" style="font-size:15px;margin-right:4px;vertical-align:middle">arrow_back</span>
            Cancelar y volver al inicio de sesión
          </a>
        </nav>
      </section>
    </div>
  </main>
  <script type="module" src="JS/recuperar.js"></script>
</body>
</html>
